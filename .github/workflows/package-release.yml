name: Package release gates

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  package-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate package contracts
        run: |
          set -euo pipefail
          bash -n packaging/aur/PKGBUILD
          bash -n packaging/shibumi-shell
          python3 tests/test_package_release.py
          python3 tests/test_shibumi_manager.py
          python3 tests/test_shibumi_suite.py
          python3 tests/test_shibumi_health.py
          python3 tests/test_inc013_drain_contract.py
          python3 tests/quickshell-empty-registry-mutation.py

      - name: Build the reproducible release asset
        run: |
          set -euo pipefail
          scripts/build-release-archive --check-reproducible

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-contract
    runs-on: [self-hosted, linux, shibumi-validation]
    permissions:
      contents: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run the revision-bound lifecycle and host gate
        env:
          SHIBUMI_INSTALLED_SOURCE_OMARCHY_PATH: ${{ vars.SHIBUMI_INSTALLED_SOURCE_OMARCHY_PATH }}
          SHIBUMI_FORWARD_COMPAT_OMARCHY_PATH: ${{ vars.SHIBUMI_FORWARD_COMPAT_OMARCHY_PATH }}
        run: |
          set -euo pipefail
          version=$(<VERSION)
          scripts/collect-release-evidence \
            --output "dist/shibumi-shell-$version.release-evidence.json"
          tar -czf "dist/shibumi-shell-$version.release-evidence.logs.tar.gz" \
            -C dist "shibumi-shell-$version.release-evidence.logs"

      - name: Verify tag, version, and pinned archive checksum
        run: |
          set -euo pipefail
          version=$(<VERSION)
          test "$GITHUB_REF_NAME" = "v$version"
          test -s ".github/release-notes/v$version.md"
          scripts/build-release-archive --check-reproducible
          archive="dist/shibumi-shell-$version.tar.gz"
          expected=$(sed -n 's/^_source_sha256=//p' packaging/aur/PKGBUILD)
          actual=$(sha256sum "$archive" | awk '{print $1}')
          test "$expected" != SKIP
          test "$actual" = "$expected"

      - name: Publish immutable GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(<VERSION)
          notes_file=".github/release-notes/v$version.md"
          release_channel=$(scripts/release-channel-flag "$version")
          gh release create "v$version" \
            "dist/shibumi-shell-$version.tar.gz" \
            "dist/shibumi-shell-$version.tar.gz.sha256" \
            "dist/shibumi-shell-$version.tar.gz.inventory.json" \
            "dist/shibumi-shell-$version.release-evidence.json" \
            "dist/shibumi-shell-$version.release-evidence.logs.tar.gz" \
            --verify-tag \
            "$release_channel" \
            --notes-file "$notes_file" \
            --title "Shibumi Shell $version"
